name: ci

# Pull requests run it here; pushes to main run it as the first stage of deploy.yml, which only ships when it passes.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check radar tests scripts
      - name: Tests
        # failing tests become annotations, which the checks API shows without signing in to read the log
        run: |
          set -o pipefail
          pytest -q -rf 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR) " pytest.log | head -10 | sed 's/^/::error title=pytest::/'
            grep -E "^E  " pytest.log | head -10 | sed 's/^/::error title=pytest detail::/'
            exit 1
          }
      - name: Extraction evals (gate)
        run: python -m radar.cli eval --golden data/golden/golden.jsonl --extractor rules --fail-under 0.70
      - name: Filter test set (500 labelled postings)
        run: python -m radar.cli eval-filters --gate

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nl-tech-job-radar:ci .
