#cloud-config
# Ubuntu 24.04 on EC2: Postgres on the host (outside Kubernetes), then single-node k3s with Traefik and cert-manager.
# The security group is the firewall; Postgres is never reachable from the internet.
package_update: true
packages: [postgresql, postgresql-contrib]
write_files:
  - path: /root/setup-postgres.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      set -e
      sudo -u postgres psql -c "CREATE USER radar WITH PASSWORD '${postgres_password}';" || true
      sudo -u postgres psql -c "CREATE DATABASE radar OWNER radar;" || true
      PGCONF=$(ls /etc/postgresql/*/main/postgresql.conf)
      PGHBA=$(ls /etc/postgresql/*/main/pg_hba.conf)
      sed -i "s/^#listen_addresses.*/listen_addresses = '*'/" "$PGCONF"
      {
        echo "host radar radar 10.42.0.0/16 scram-sha-256"   # k3s pod network
        echo "host radar radar 10.43.0.0/16 scram-sha-256"   # k3s service network
      } >> "$PGHBA"
      systemctl restart postgresql
  - path: /etc/cron.daily/radar-pgdump
    permissions: "0755"
    content: |
      #!/bin/bash
      # nightly dump: 14 days on the server, 30 days in S3 (off the server)
      set -eo pipefail
      mkdir -p /var/backups/radar
      f=/var/backups/radar/radar-$(date +%F).sql.gz
      sudo -u postgres pg_dump radar | gzip > "$f"
      find /var/backups/radar -mtime +14 -delete
      /snap/bin/aws s3 cp "$f" "s3://${backup_bucket}/daily/$(basename "$f")" --only-show-errors
runcmd:
  # 2 GB swap as a cushion on a 4 GB machine
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  # compressed swap in RAM, used before the swap file: swapping to it is far cheaper than to disk, which is what
  # stalled the node (added by hand on 20 Oct 2026 through a node debug pod)
  - DEBIAN_FRONTEND=noninteractive apt-get install -y systemd-zram-generator
  - printf '[zram0]\nzram-size = ram / 2\ncompression-algorithm = zstd\nswap-priority = 100\n' > /etc/systemd/zram-generator.conf
  - echo 'vm.swappiness = 100' > /etc/sysctl.d/99-zram.conf && sysctl -q -p /etc/sysctl.d/99-zram.conf
  - systemctl daemon-reload && systemctl start systemd-zram-setup@zram0.service dev-zram0.swap
  - /root/setup-postgres.sh
  - snap install aws-cli --classic
  # memory trims for a 2 GB node: no metrics-server, a soft memory cap for k3s, no multipathd (unused on EC2)
  - mkdir -p /etc/rancher/k3s && printf 'disable:\n  - metrics-server\n' > /etc/rancher/k3s/config.yaml
  # (at 400 MiB the k3s heap sat at the cap and k3s spent more than one core on garbage collection, 6 Oct 2026)
  - echo 'GOMEMLIMIT=640MiB' >> /etc/systemd/system/k3s.service.env
  - systemctl disable --now multipathd.service multipathd.socket || true
  - curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --tls-san ${public_ip}" sh -
  - sleep 30
  - /usr/local/bin/kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.3/cert-manager.yaml
  # kubeconfig for the laptop: scp ubuntu@${public_ip}:kubeconfig ~/.kube/radar.yaml
  - sed "s/127.0.0.1/${public_ip}/" /etc/rancher/k3s/k3s.yaml > /home/ubuntu/kubeconfig
  - chown ubuntu:ubuntu /home/ubuntu/kubeconfig && chmod 600 /home/ubuntu/kubeconfig
