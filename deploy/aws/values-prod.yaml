# Helm values for techjobsradar.com (formerly techjobsradar.nl) on the single AWS server (deploy/aws). Secrets are created separately:
#   radar-db (RADAR_DATABASE_URL), radar-admin (RADAR_ADMIN_TOKEN), radar-smtp (RADAR_SMTP_USER, RADAR_SMTP_PASSWORD),
#   ghcr (image pull secret for the private GitHub package).
image:
  repository: ghcr.io/shreya-sebastian/jobradar  # follows the GitHub repository's name (deploy.yml pushes there)
  tag: latest
  pullPolicy: Always
  pullSecrets: [ghcr]

database:
  existingSecret: radar-db

admin:
  existingSecret: radar-admin

# Login mail goes through Resend (free tier, no sending review); the secret holds user "resend" and an API key
# with sending access only. Amazon SES (deploy/aws/main.tf) stays set up as a fallback.
mail:
  backend: smtp
  from: "Tech Jobs Radar <login@techjobsradar.nl>"
  smtpHost: smtp.resend.com
  smtpPort: 587
  existingSecret: radar-smtp

google:
  existingSecret: radar-google   # created by hand; optional, the Google button stays hidden until it exists
  indexingSecret: radar-google-indexing   # created by hand: the Indexing API service account (radar/indexing.py)

config:
  corsOrigins: "https://techjobsradar.com"
  siteName: "Tech Jobs Radar"
  siteAliases: "Tech Jobs, Tech Jobs Radar, TechJobsRadar, techjobsradar.com, techjobsradar.nl, TechJobsNL, Tech Jobs NL, ICT vacatures, IT vacatures, tech jobs Netherlands"
  siteUrl: "https://techjobsradar.com"
  extraEnv:
    RADAR_REDIRECT_HOSTS: "techjobsradar.nl"  # moved to .com on 28 Oct 2026
    RADAR_SOURCE_URL: ""  # the repository is private: no source link in the footer
    RADAR_REVIEW_THRESHOLD: "0.7"
    RADAR_REVIEW_FIELDS: "role_family"
    RADAR_INDEXNOW_KEY: "162fc22f47b0b0cf6d3cfdfd718d14ff"  # public by design: served at /<key>.txt (radar/indexnow.py)

# sized for one 2 GB node (t3.small): k3s, Postgres, Traefik and cert-manager use about 1 GB, so the app gets
# the rest, with a hard cap per pod so one process cannot push the node into swap
api:
  replicas: 1
  autoscaling:
    enabled: false
  # stop the old pod before starting the new one: a deploy takes the site away for 30-60 s, but two API processes
  # side by side stalled the 2 GB node on memory (20 Oct 2026, the rollout right after an outage)
  strategy:
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  resources:
    requests: {cpu: 100m, memory: 200Mi}
    limits: {cpu: "1", memory: 450Mi}
worker:
  replicas: 1
  timetable: true             # periodic jobs from the worker, no CronJob pods
  # a second worker for the quick ATS boards (radar/queue.py). Off on the 2 GB node: with it the node ran out of
  # memory and swapped, and the stalls failed every health check on it (6 Oct 2026). The main worker serves the
  # quick queue as well, so crawls only take longer
  light:
    enabled: false
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 100Mi}
      limits: {cpu: 500m, memory: 350Mi}
  resources:
    requests: {cpu: 100m, memory: 200Mi}
    limits: {cpu: "1", memory: 600Mi}
  # stop the old worker before starting the new one, so a deploy never runs two on a 2 GB node
  # (a crawl job in flight is re-queued)
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

redis:
  maxmemory: 96mb  # under the 128Mi limit: Redis evicts expiring keys instead of being killed
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}

ingress:
  host: techjobsradar.com
  tlsSecret: techjobsradar-com-tls
  # the former address, on the certificate it always had: the app answers it with a 301 to the same page on .com
  # (RADAR_REDIRECT_HOSTS)
  extraHosts:
    - {host: techjobsradar.nl, tlsSecret: radar-radar-tls}
