# Flux watches this repository's `deploy` branch (main's last tested commit plus the image tag, written by
# .github/workflows/deploy.yml) and applies deploy/flux, itself included. The cluster pulls; nothing outside it
# needs access to the Kubernetes API. The repository is private: Flux reads it over SSH with a read-only deploy key
# (Secret flux-deploy-key: identity, identity.pub, known_hosts; the public half is under the repo's Deploy keys).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m  # each check costs the 2 GB node some CPU; a deploy starts up to 5 minutes after a push
  url: ssh://git@github.com/Shreya-Sebastian/JobRadar
  secretRef:
    name: flux-deploy-key
  ref:
    branch: deploy
  # only the deployment files and the chart: a small artifact, and app-only commits do not touch the cluster
  ignore: |
    /*
    !/deploy/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/flux
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
