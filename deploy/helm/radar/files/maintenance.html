<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="60">
<title>Tech Jobs is being updated</title>
<style>
  :root { --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #047857; --on-accent: #ffffff; --logo-edge: #020617; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #020617; --card: #0f172a; --ink: #f1f5f9; --muted: #94a3b8; --line: #1e293b; --accent: #34d399; --on-accent: #022c22; --logo-edge: #334155; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif; }
  main { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; font-size: 22px; margin-bottom: 24px; }
  .logo { width: 40px; height: 40px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0; color: var(--muted); }
  /* one language: English unless the visitor reads the site in Dutch (the script below decides) */
  html[lang="en"] [lang="nl"], html[lang="nl"] [lang="en"] { display: none; }
  .wait { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; font-size: 14px; color: var(--muted); }
  .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg class="logo" aria-hidden="true" viewBox="0 0 32 32"><rect x=".5" y=".5" width="31" height="31" rx="8" fill="#020617" stroke="var(--logo-edge, #020617)"/><g stroke-width="1.3" stroke-linejoin="round"><path d="M6.29 19.20L8.24 21.15L6.29 23.10L4.34 21.15Z" fill="#1aa3bc" stroke="#1aa3bc"/><path d="M12.76 19.20L14.71 21.15L12.76 23.10L10.81 21.15Z" fill="#1aa3bc" stroke="#1aa3bc"/><path d="M19.24 19.20L21.19 21.15L19.24 23.10L17.29 21.15Z" fill="#fed7aa" stroke="#fed7aa"/><path d="M25.71 19.20L27.66 21.15L25.71 23.10L23.76 21.15Z" fill="#1aa3bc" stroke="#1aa3bc"/><path d="M9.53 15.97L11.48 17.92L9.53 19.87L7.58 17.92Z" fill="#22a596" stroke="#22a596"/><path d="M16.0 15.97L17.95 17.92L16.0 19.87L14.05 17.92Z" fill="#fdba74" stroke="#fdba74"/><path d="M22.47 15.97L24.42 17.92L22.47 19.87L20.52 17.92Z" fill="#22a596" stroke="#22a596"/><path d="M12.76 12.73L14.71 14.68L12.76 16.63L10.81 14.68Z" fill="#28a676" stroke="#28a676"/><path d="M19.24 12.73L21.19 14.68L19.24 16.63L17.29 14.68Z" fill="#fb923c" stroke="#fb923c"/><path d="M16.0 7.70L17.95 9.65L16.0 11.60L14.05 9.65Z" fill="#f97316" stroke="#f97316"/></g></svg>
    Tech Jobs
  </div>
  <div lang="en">
    <h1>Being updated</h1>
    <p>The site is back in about a minute. This page reloads by itself.</p>
  </div>
  <div lang="nl">
    <h1>Wordt bijgewerkt</h1>
    <p>De site is over ongeveer een minuut terug. Deze pagina laadt vanzelf opnieuw.</p>
  </div>
  <div class="wait" role="status"><span class="spin" aria-hidden="true"></span><span lang="en">Checking</span><span lang="nl">Even geduld</span></div>
</main>
<script>
  // the site's own language choice: the one the visitor picked, else a Dutch address, else the browser's language
  (function () {
    var lang = null;
    try { lang = JSON.parse(localStorage.getItem("radar.lang")); } catch (e) { /* private mode */ }
    if (lang !== "nl" && lang !== "en") {
      lang = /^\/nl(\/|$)/.test(location.pathname) || (navigator.language || "").toLowerCase().indexOf("nl") === 0 ? "nl" : "en";
    }
    document.documentElement.lang = lang;
    if (lang === "nl") document.title = "Tech Jobs wordt bijgewerkt";
  })();
  // reload as soon as the site answers again
  (function check() {
    fetch("/healthz", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.ok) location.reload(); else setTimeout(check, 4000); })
      .catch(function () { setTimeout(check, 4000); });
  })();
</script>
</body>
</html>
