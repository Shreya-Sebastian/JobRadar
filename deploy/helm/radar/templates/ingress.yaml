{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "radar.fullname" . }}
  # no chart or version label: Flux stamps the chart version with each commit, and a changed Ingress makes Traefik and
  # cert-manager reload the certificate, which Cloudflare saw as a broken one for a moment (a 526) on every deploy
  labels:
    app.kubernetes.io/name: {{ include "radar.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    {{- if .Values.ingress.tls }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
    {{- if .Values.maintenance.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "radar.fullname" . }}-maintenance@kubernetescrd
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret | default (printf "%s-tls" (include "radar.fullname" .)) }}
    {{- /* one certificate per extra host, named in the values, so moving a host between `host` and `extraHosts`
    reuses its certificate instead of issuing a new one (a gap Cloudflare shows as a 526) */}}
    {{- range .Values.ingress.extraHosts }}
    - hosts: [{{ .host | quote }}]
      secretName: {{ .tlsSecret }}
    {{- end }}
  {{- end }}
  rules:
    {{- $svc := printf "%s-api" (include "radar.fullname" .) }}
    {{- range prepend (.Values.ingress.extraHosts | default list) (dict "host" .Values.ingress.host) }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  name: http
    {{- end }}
{{- end }}
