apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radar.fullname" . }}-worker
  labels: {{- include "radar.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.keda.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  {{- with .Values.worker.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "radar.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "radar.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.worker.metricsPort | quote }}
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- range . }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 120   # let an in-flight board fetch finish
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "radar.cli", "worker", "--metrics-port", {{ .Values.worker.metricsPort | quote }}]
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort }}
          env: {{- include "radar.env" . | nindent 12 }}
            {{- if .Values.worker.timetable }}
            - name: RADAR_WORKER_TIMETABLE
              value: "true"
            {{- end }}
            {{- if .Values.google.indexingSecret }}
            - name: RADAR_GOOGLE_INDEXING_KEY
              value: /var/run/secrets/indexing/key.json
            {{- end }}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 30
            failureThreshold: 3
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.google.indexingSecret }}
          volumeMounts:
            - {name: indexing-key, mountPath: /var/run/secrets/indexing, readOnly: true}
          {{- end }}
      {{- if .Values.google.indexingSecret }}
      volumes:
        - name: indexing-key
          secret:
            secretName: {{ .Values.google.indexingSecret }}
            optional: true
      {{- end }}
{{- if .Values.worker.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "radar.fullname" . }}-worker
  labels: {{- include "radar.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "radar.fullname" . }}-worker
  minReplicaCount: {{ .Values.worker.keda.minReplicas }}
  maxReplicaCount: {{ .Values.worker.keda.maxReplicas }}
  cooldownPeriod: {{ .Values.worker.keda.cooldownPeriod }}
  triggers:
    - type: redis
      metadata:
        address: {{ include "radar.fullname" . }}-redis:6379
        listName: rq:queue:crawl
        listLength: {{ .Values.worker.keda.listLength | quote }}
{{- end }}
{{- if .Values.worker.light.enabled }}
---
# the quick ATS boards only (queue crawl-light): no timetable, no indexing key, a small memory cap
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radar.fullname" . }}-worker-light
  labels: {{- include "radar.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-light
spec:
  replicas: {{ .Values.worker.light.replicas }}
  strategy:
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "radar.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker-light
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "radar.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker-light
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.worker.metricsPort | quote }}
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- range . }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "radar.cli", "worker", "--queues", "crawl-light",
                    "--metrics-port", {{ .Values.worker.metricsPort | quote }}]
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort }}
          env: {{- include "radar.env" . | nindent 12 }}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 30
            failureThreshold: 3
          resources: {{- toYaml .Values.worker.light.resources | nindent 12 }}
{{- end }}
