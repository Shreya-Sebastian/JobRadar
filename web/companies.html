<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employers hiring for tech in the Netherlands | {{SITE_NAME}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{SITE_URL}}/companies">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:image" content="{{SITE_URL}}/static/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/static/app.css?v=7">
<script type="application/ld+json">{{JSONLD}}</script>
<script src="/static/theme.js?v=1"></script>
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <a class="brand" href="/"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><g fill="none" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="16" r="10" opacity=".35"/><circle cx="16" cy="16" r="5.5" opacity=".6"/><path d="M16 16l7-7"/></g><circle cx="16" cy="16" r="1.8" fill="var(--on-accent)"/><circle cx="10.5" cy="20" r="1.8" fill="var(--on-accent)"/></svg><b>{{SITE_NAME}}</b></a>
    <button type="button" class="theme-btn" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
  <nav class="tabs wrap">
    <a href="/#jobs">Jobs</a><a href="/#market">Market</a><a href="/companies" class="on">Employers</a>
  </nav>
</header>
<main class="wrap pt-1">
  <p class="tag mt-4 mb-0">{{SITE_TAGLINE}}</p>
  <div class="card">
    <h2>{{COUNT}} employers with open tech roles</h2>
    <ul class="cols">{{ITEMS}}</ul>
  </div>
</main>
<footer class="site-footer"><div class="wrap py-8"><p><b class="text-ink">{{SITE_NAME}}</b> lists tech vacancies in the Netherlands read directly from employers' career sites.</p></div></footer>
</body>
</html>
