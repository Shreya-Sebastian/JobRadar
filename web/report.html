<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DOC_TITLE}} | {{SITE_NAME}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{SITE_URL}}{{SELF_PATH}}">
<link rel="alternate" hreflang="en" href="{{SITE_URL}}{{EN_PATH}}">
<link rel="alternate" hreflang="nl" href="{{SITE_URL}}{{NL_PATH}}">
<link rel="alternate" hreflang="x-default" href="{{SITE_URL}}{{EN_PATH}}">
<link rel="icon" href="/static/favicon.svg?v=7" type="image/svg+xml">
<link rel="icon" href="/favicon.ico?v=7" sizes="48x48">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=7">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{SITE_URL}}{{SELF_PATH}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:image" content="{{SITE_URL}}/static/og-card.png?v=8">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="/static/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css?v=76">
<script type="application/ld+json">{{JSONLD}}</script>
<script src="/static/theme.js?v=2"></script>
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <a class="brand" href="{{HOME}}"><svg class="logo" aria-hidden="true" viewBox="0 0 32 32"><rect x=".5" y=".5" width="31" height="31" rx="8" fill="#020617" stroke="var(--logo-edge, #020617)"/><g stroke-linejoin="round"><path d="M6.30 19.25L16.00 14.40L25.70 19.25L16.00 24.10Z" fill="#020617" stroke="#020617" stroke-width="2.60"/><path d="M6.30 19.25L16.00 14.40L25.70 19.25L16.00 24.10Z" fill="#0f766e" stroke="#0f766e" stroke-width="1.10"/><path d="M9.00 14.65L16.00 11.15L23.00 14.65L16.00 18.15Z" fill="#020617" stroke="#020617" stroke-width="2.60"/><path d="M9.00 14.65L16.00 11.15L23.00 14.65L16.00 18.15Z" fill="#14b8a6" stroke="#14b8a6" stroke-width="1.10"/><path d="M11.70 10.05L16.00 7.90L20.30 10.05L16.00 12.20Z" fill="#020617" stroke="#020617" stroke-width="2.60"/><path d="M11.70 10.05L16.00 7.90L20.30 10.05L16.00 12.20Z" fill="#fb923c" stroke="#fb923c" stroke-width="1.10"/></g></svg><b>{{BRAND}}</b></a>
    <button type="button" class="theme-btn" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>
<main class="wrap pt-4 report">
  <h1 class="mt-4 mb-1 text-2xl sm:text-3xl">{{TITLE}}</h1>
  <p class="muted mt-0 mb-4">{{RANGE}}</p>
  <div class="kpis">{{TILES}}</div>
  <div class="grid two">
    <section class="card"><h2>{{L_SKILLS}}</h2>{{SKILLS}}</section>
    <section class="card"><h2>{{L_POSITIONS}}</h2>{{POSITIONS}}</section>
    <section class="card"><h2>{{L_CITIES}}</h2>{{CITIES}}</section>
    <section class="card"><h2>{{L_EXP}}</h2>{{EXP}}</section>
  </div>
  <p class="mt-6"><a class="btn primary" href="{{HOME}}#discover">{{L_JOBS}}</a></p>
  <p class="small muted">{{METHOD}}</p>
</main>
<footer class="site-footer"><div class="wrap py-8"><p><b class="text-ink">{{SITE_NAME}}</b> · {{SITE_URL}}</p>{{FOOT_LINKS}}</div></footer>
</body>
</html>
