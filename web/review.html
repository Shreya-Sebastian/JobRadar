<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Review · {{SITE_NAME}}</title>
<link rel="icon" href="/static/favicon.svg?v=7" type="image/svg+xml">
<link rel="icon" href="/favicon.ico?v=7" sizes="48x48">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=7">
<link rel="preload" href="/static/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css?v=40">
<script src="/static/theme.js?v=2"></script>
<style>
  .an td.val { white-space: nowrap; }
  .an td.why { min-width: 18rem; }
  .an select { padding-top: .3rem; padding-bottom: .3rem; font-size: .875rem; }
</style>
</head>
<body>
<main class="an wrap max-w-[1320px] pt-5 pb-12">
  <form class="card mx-auto mt-[12vh] max-w-md" id="gate" hidden autocomplete="off">
    <h1 class="text-xl">Review</h1>
    <p class="small muted">Enter the admin token. It is kept in this browser tab only.</p>
    <input type="text" id="token" name="admin-token" class="masked" autocomplete="off" spellcheck="false" data-lpignore="true" data-1p-ignore
           data-form-type="other" placeholder="admin token" required class="my-3 w-full">
    <button class="primary" type="submit">Open</button>
    <p class="small bad" id="gate-err"></p>
  </form>

  <div id="app" hidden>
    <header class="mb-4 flex flex-wrap items-center gap-x-4 gap-y-2">
      <a class="brand" href="/"><svg class="logo" aria-hidden="true" viewBox="0 0 32 32"><rect x=".5" y=".5" width="31" height="31" rx="8" fill="#020617" stroke="var(--logo-edge, #020617)"/><g stroke-linejoin="round"><path d="M6.30 19.25L16.00 14.40L25.70 19.25L16.00 24.10Z" fill="#020617" stroke="#020617" stroke-width="2.60"/><path d="M6.30 19.25L16.00 14.40L25.70 19.25L16.00 24.10Z" fill="#0f766e" stroke="#0f766e" stroke-width="1.10"/><path d="M9.00 14.65L16.00 11.15L23.00 14.65L16.00 18.15Z" fill="#020617" stroke="#020617" stroke-width="2.60"/><path d="M9.00 14.65L16.00 11.15L23.00 14.65L16.00 18.15Z" fill="#14b8a6" stroke="#14b8a6" stroke-width="1.10"/><path d="M11.70 10.05L16.00 7.90L20.30 10.05L16.00 12.20Z" fill="#020617" stroke="#020617" stroke-width="2.60"/><path d="M11.70 10.05L16.00 7.90L20.30 10.05L16.00 12.20Z" fill="#fb923c" stroke="#fb923c" stroke-width="1.10"/></g></svg><b>Review</b></a><span class="small muted">{{SITE_NAME}}</span>
      <span class="small muted" id="stamp"></span>
      <div class="controls ml-auto flex flex-wrap items-center gap-2">
        <button type="button" class="theme-btn" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button id="refresh">Refresh</button>
        <button id="logout" class="link">Sign out</button>
      </div>
    </header>

    <div class="card mb-4"><h2>On the site</h2><p class="small m-0" id="applying"></p></div>

    <div class="card mb-4 overflow-x-auto"><h2>Recent runs</h2><div id="runs"></div></div>

    <div class="card overflow-x-auto">
      <div class="mb-3 flex flex-wrap items-center gap-3">
        <h2 class="m-0">Latest decisions <span class="hint" id="count"></span></h2>
        <div class="ml-auto flex flex-wrap items-center gap-2">
          <select id="f-field" aria-label="Field"><option value="">All fields</option></select>
          <select id="f-run" aria-label="Run"><option value="">All runs</option></select>
          <select id="f-status" aria-label="Status">
            <option value="">Any status</option><option value="applied">Applied</option><option value="rejected">Rejected</option>
          </select>
          <label class="small flex items-center gap-1"><input type="checkbox" id="f-changed" checked> Only where the rules differ</label>
        </div>
      </div>
      <div id="list"></div>
    </div>
    <p class="small muted mt-4">Each decision is one field of one posting as read by the review. Rejecting an applied decision takes it off the site at once, and the rules' value shows again.</p>
  </div>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const val = (v) => v === null || v === undefined ? '<span class="muted">not stated</span>' : v === true ? "yes" : v === false ? "no" : esc(v);
  const when = (iso) => new Date(iso + "Z").toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" });
  const TOKEN_KEY = "radar.review.token";
  let token = null, data = null;
  try { token = sessionStorage.getItem(TOKEN_KEY); } catch { /* storage blocked */ }
  const auth = () => ({ Authorization: `Bearer ${token}` });

  function paintSettings(s) {
    $("#applying").innerHTML = s.threshold === null || !s.fields.length
      ? "Nothing is applied: set RADAR_REVIEW_THRESHOLD and RADAR_REVIEW_FIELDS to apply decisions."
      : `Applied: decisions with confidence of at least <b>${esc(s.threshold)}</b> for <b>${s.fields.map(esc).join(", ")}</b>.`;
  }
  function paintRuns(runs) {
    $("#runs").innerHTML = runs.length
      ? `<table><tr><th>Run</th><th>Model</th><th style="text-align:right">Decisions</th><th style="text-align:right">Applied</th><th>Finished</th></tr>${runs.map((r) => `<tr><td><code>${esc(r.run_id)}</code></td><td>${esc(r.model)}</td><td class="n">${r.decisions}</td><td class="n">${r.applied}</td><td class="whitespace-nowrap">${when(r.at)}</td></tr>`).join("")}</table>`
      : `<div class="empty">No runs yet</div>`;
  }
  function options(sel, values, label) {
    const keep = $(sel).value;
    $(sel).innerHTML = `<option value="">${label}</option>` + values.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
    $(sel).value = values.includes(keep) ? keep : "";
  }
  function paintList() {
    const only = $("#f-changed").checked;
    const rows = data.items.filter((d) => !only || JSON.stringify(d.old) !== JSON.stringify(d.new));
    $("#count").textContent = `${rows.length} shown`;
    $("#list").innerHTML = rows.length
      ? `<table><tr><th>Posting</th><th>Field</th><th>Rules</th><th>Review</th><th style="text-align:right">Confidence</th><th>Reason</th><th>Status</th><th></th></tr>${rows.map((d) => `<tr>
          <td><a href="${esc(d.path)}" target="_blank" rel="noopener">${esc(d.title)}</a><div class="small muted">${esc(d.company)} · ${when(d.created_at)} · ${esc(d.model)}</div></td>
          <td><code>${esc(d.field)}</code></td><td class="val">${val(d.old)}</td><td class="val"><b>${val(d.new)}</b></td>
          <td class="n">${Math.round(d.confidence * 100)}%</td><td class="why small">${esc(d.reason)}</td>
          <td>${d.rejected ? '<span class="pill-s bot">Rejected</span>' : d.applied ? '<span class="pill-s human">Applied</span>' : '<span class="muted small">Stored</span>'}</td>
          <td><button data-id="${d.id}" data-undo="${d.rejected}">${d.rejected ? "Undo" : "Reject"}</button></td></tr>`).join("")}</table>`
      : `<div class="empty">No decisions match</div>`;
  }

  async function load() {
    const q = new URLSearchParams({ limit: "500" });
    if ($("#f-field").value) q.set("field", $("#f-field").value);
    if ($("#f-run").value) q.set("run_id", $("#f-run").value);
    if ($("#f-status").value) q.set("status", $("#f-status").value);
    const r = await fetch(`/api/admin/review/decisions?${q}`, { headers: auth(), cache: "no-store" });
    if (r.status === 401 || r.status === 404) { signOut(r.status === 404 ? "The admin token is not configured on this server." : "That token was not accepted."); return; }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
    paintSettings(data.settings);
    paintRuns(data.runs);
    options("#f-field", data.fields, "All fields");
    options("#f-run", data.runs.map((x) => x.run_id), "All runs");
    paintList();
    $("#stamp").textContent = "loaded " + new Date().toLocaleTimeString("en-GB", { timeStyle: "short" });
  }
  function start() {
    $("#gate").hidden = true; $("#app").hidden = false;
    load().catch((e) => { $("#stamp").textContent = "could not load: " + e.message; });
  }
  function signOut(msg) {
    token = null;
    try { sessionStorage.removeItem(TOKEN_KEY); } catch { /* storage blocked */ }
    $("#app").hidden = true; $("#gate").hidden = false; $("#gate-err").textContent = msg || "";
  }
  $("#gate").addEventListener("submit", (e) => {
    e.preventDefault(); token = $("#token").value.trim(); $("#token").value = "";
    try { sessionStorage.setItem(TOKEN_KEY, token); } catch { /* storage blocked */ }
    start();
  });
  $("#list").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-id]"); if (!b) return;
    b.disabled = true;
    const r = await fetch(`/api/admin/review/decisions/${b.dataset.id}/reject?undo=${b.dataset.undo}`, { method: "POST", headers: auth() });
    if (!r.ok) { b.disabled = false; $("#stamp").textContent = `could not save: HTTP ${r.status}`; return; }
    load().catch(() => {});
  });
  ["#f-field", "#f-run", "#f-status"].forEach((s) => $(s).addEventListener("change", () => load().catch(() => {})));
  $("#f-changed").addEventListener("change", () => data && paintList());
  $("#refresh").addEventListener("click", () => load().catch(() => {}));
  $("#logout").addEventListener("click", () => signOut());
  if (token) start(); else signOut();
})();
</script>
</body>
</html>
